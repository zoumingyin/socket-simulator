[package]
name = "socket-service-manager"
version = "2.0.0"
edition = "2021"
description = "Socket 服务管理平台"

[lib]
name = "socket_service_manager"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 异步运行时（复用 Tauri 内置 tokio）
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
# REST 框架（启用 ws feature 以支持管理端 WebSocket 通道 /admin/ws）
axum = { version = "0.7", features = ["ws"] }
# Mock 服务用：正则匹配（headers/query matchKind=regex）
regex = "1"
tower = "0.5"
tower-http = { version = "0.5", features = ["cors"] }
# 受管服务 WS 服务端
tokio-tungstenite = "0.24"
futures-util = "0.3"
# 受管服务 Socket.IO 服务端（基于 hyper 1.0 / http 1.0，兼容官方 JS 客户端 v3+）
socketioxide = "0.18"
# 受管 Socket.IO 服务用独立端口（与管理端 3080 隔离），直接用 hyper-util 驱动
# socketioxide 原生 hyper 1.0 服务（SocketIoService），与既有 axum 0.7 REST/admin 栈互不干扰
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }

# 错误处理 / 诊断
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1"

# 时间 / ID
chrono = "0.4"
nanoid = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }

# WSS（仅受管服务启用，证书缺失降级纯 WS）
tokio-rustls = "0.25"
rustls = "0.23"
rustls-pemfile = "2"
# 前端静态资源嵌入（将 dist/ 编入二进制，由 axum 统一路由提供）
rust-embed = "8"
specta = "1.0.5"
# v3 P0-4：OpenAPI 3.1 生成（契约权威源；utoipa 5.x 默认输出 OpenAPI 3.1 spec）
utoipa = { version = "5", features = ["macros"] }

# v3 P0-1：SQLite 存储（可替换 Repository 后端，取代单一 config.json）
# - default-features=false 关掉 sqlx 默认启的 chrono/uuid/runtime 等，按需开启
# - runtime-tokio 复用 Tauri 内置 tokio；json 支持 serde_json 字段存储
# - libsqlite3-sys 显式 bundled：Windows 沙箱无系统 sqlite 开发库，编译自包含
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "json"] }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol", "devtools"]
custom-protocol = ["tauri/custom-protocol"]
devtools = ["tauri/devtools"]
